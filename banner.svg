<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Adivhaho Mulaudzi</title>
  <desc id="d">Aspiring Software Engineer. C#, ASP.NET Core, Python, FastAPI. BSc Information Technology at North-West University, South Africa.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0F3B4C"/>
      <stop offset="1" stop-color="#07131F"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#7CF5C8"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2DD4A7"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2DD4A7" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="45"/></filter>
    <style>
      .tr{stroke:#2DD4A7;stroke-width:2.5;fill:none;stroke-opacity:.55;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 3.5s ease-out forwards}
      .d2{animation-delay:.6s}.d3{animation-delay:1.2s}
      .n{fill:#2DD4A7;animation:pulse 2.4s ease-in-out infinite}
      .p{fill:#FFC857;animation:pulse 2.4s ease-in-out infinite;animation-delay:1.2s}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- traces left -->
  <path class="tr" d="M0 80 H60 V130 H150"/>
  <path class="tr d2" d="M0 220 H100 V175 H170"/>
  <path class="tr d3" d="M50 300 V255 H130"/>
  <circle class="n" cx="150" cy="130" r="6" filter="url(#glow)"/>
  <circle class="p" cx="170" cy="175" r="6" filter="url(#glow)"/>
  <circle class="n" cx="130" cy="255" r="5" filter="url(#glow)"/>
  <!-- traces right -->
  <path class="tr" d="M1200 70 H1130 V120 H1045"/>
  <path class="tr d2" d="M1200 210 H1090 V245 H1025"/>
  <path class="tr d3" d="M1150 0 V40 H1075"/>
  <circle class="p" cx="1045" cy="120" r="6" filter="url(#glow)"/>
  <circle class="n" cx="1025" cy="245" r="6" filter="url(#glow)"/>
  <circle class="n" cx="1075" cy="40" r="5" filter="url(#glow)"/>

  <ellipse cx="600" cy="140" rx="340" ry="105" fill="#2DD4A7" opacity=".22" filter="url(#soft)"/>

  <text class="mono" x="600" y="88" text-anchor="middle" font-size="18" letter-spacing="3" fill="#7CF5C8">$ whoami</text>
  <text class="sans" x="600" y="162" text-anchor="middle" font-size="64" font-weight="800" fill="url(#title)">Adivhaho Mulaudzi</text>
  <rect x="510" y="184" width="180" height="5" rx="2.5" fill="url(#bar)"/>
  <text class="sans" x="600" y="226" text-anchor="middle" font-size="22" font-weight="600" fill="#D9F7EE">Aspiring Software Engineer  ·  C#  ·  Python  ·  APIs</text>
  <text class="mono" x="600" y="260" text-anchor="middle" font-size="15" fill="#FFC857">BSc IT @ North-West University · South Africa<tspan class="cur" fill="#7CF5C8"> ▌</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
